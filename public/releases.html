<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Releases - My Awesome Desktop App</title>
  <!-- Link to refactored CSS files -->
  <link rel="stylesheet" href="css/root.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/page.css">

  <script>
    (function () {
      // Function to set the theme
      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      }

      // Check for a saved theme in localStorage
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        return;
      }

      // If no saved theme, check the OS/browser preference
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');

    })();
  </script>
</head>

<body>

  <header id="main-header"></header>

  <main class="page-container">
    <h1>Release Notes</h1>

    <div id="releases-container">
      <p>Loading releases...</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Liiesl. All rights reserved.</p>
  </footer>

  <script src="releases.js"></script>
  <script type="module" src="main.js"></script>
</body>

</html>
